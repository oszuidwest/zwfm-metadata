---
name: CI

on:
  push:
    branches: ['main']
    paths: &ci_paths
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.golangci.yml'
      - '.golangci.yaml'
      - 'web/assets/**'
      - 'package.json'
      - 'bun.lock'
      - 'biome.json'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: ['main']
    paths: *ci_paths

permissions:
  contents: read

jobs:
  ci:
    uses: oszuidwest/.github-templates/.github/workflows/go-ci.yml@v3
    with:
      enable-frontend: true
