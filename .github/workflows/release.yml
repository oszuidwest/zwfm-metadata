---
# Thin shim — delegates to oszuidwest/.github-templates go-release.yml@v2.
# Docker publishing is composed via a second job that calls
# docker-publish.yml@v2 directly, gated on the release outputs.
# The `body` job exists only to compute the v-stripped version for the
# `docker pull` line in release notes (GitHub Actions expressions can't slice).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (edge, vX.Y.Z, or X.Y.Z auto-prefixed)'
        required: true
        default: 'edge'

permissions:
  contents: read

jobs:
  body:
    runs-on: ubuntu-latest
    outputs:
      text: ${{ steps.compute.outputs.text }}
    steps:
      - id: compute
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${INPUT_VERSION:-$REF_NAME}"
          VERSION_NO_V="${VERSION#v}"
          IMAGE="ghcr.io/oszuidwest/zwfm-metadata:${VERSION_NO_V}"
          {
            echo 'text<<RELEASE_BODY_EOF'
            echo "**Docker**: \`docker pull ${IMAGE}\`"
            echo ""
            echo "Binary downloads are available below as release assets."
            echo 'RELEASE_BODY_EOF'
          } >> "$GITHUB_OUTPUT"

  release:
    needs: body
    uses: oszuidwest/.github-templates/.github/workflows/go-release.yml@v2
    with:
      project-name: metadata
      ldflags-target: zwfm-metadata/utils
      build-matrix: >-
        [{"os":"linux","arch":"amd64"},
         {"os":"linux","arch":"arm64"},
         {"os":"linux","arch":"arm","arm":"7"},
         {"os":"windows","arch":"amd64"},
         {"os":"windows","arch":"arm64"},
         {"os":"darwin","arch":"amd64"},
         {"os":"darwin","arch":"arm64"}]
      version: ${{ inputs.version }}
      release-body: ${{ needs.body.outputs.text }}
    permissions:
      contents: write

  docker:
    needs: release
    if: needs.release.outputs.is_release == 'true'
    uses: oszuidwest/.github-templates/.github/workflows/docker-publish.yml@v2
    with:
      version: ${{ needs.release.outputs.version }}
      image-labels: |
        org.opencontainers.image.title=ZuidWest FM Metadata
        org.opencontainers.image.description=Metadata middleware for ZuidWest FM
        org.opencontainers.image.vendor=Streekomroep ZuidWest
        org.opencontainers.image.licenses=MIT
    permissions:
      contents: read
      packages: write
